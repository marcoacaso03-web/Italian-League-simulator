name: Scrape FBref Serie A

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons (space-separated or "all")'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium

      - name: Scrape FBref (Playwright)
        run: |
          cd scripts
          if [ "${{ inputs.seasons }}" = "all" ]; then
            python scrape_gh_actions.py
          else
            python scrape_gh_actions.py --seasons ${{ inputs.seasons }}
          fi

      - name: Validate
        run: |
          python3 -c "
          import json
          clubs = json.load(open('data/clubs.json'))
          players = json.load(open('data/players.json'))
          total = sum(len(p['seasons']) for p in players)
          print(f'clubs={len(clubs)}, players={len(players)}, seasons={total}')
          assert len(clubs) > 0, 'No clubs!'
          assert len(players) > 100, f'Too few players: {len(players)}'
          print('✅ OK')
          "

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clubs.json data/players.json
          git diff --staged --quiet || git commit -m "data: update clubs + players [skip ci]"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serie-a-data
          path: data/
          retention-days: 30
