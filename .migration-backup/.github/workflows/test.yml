name: Test Cloudflare Bypass

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          playwright install chromium
      - name: Test CF wait
        run: python scripts/test_cf_wait.py
      - name: Show HTML snippet
        if: always()
        run: head -50 /tmp/fbref_loaded.html 2>/dev/null || echo "no file"
